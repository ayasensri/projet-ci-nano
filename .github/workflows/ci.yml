
name: Pipeline CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Afficher les informations
        run: |
          echo "Utilisateur : ${{ github.actor }}"
          echo "Branche : ${{ github.ref }}"
          java --version
          mvn --version

      - name: Compiler
        run: mvn clean compile

      - name: Exécuter les tests
        run: mvn test

      - name: Afficher les résultats
        if: always()
        run: |
          echo "=== Résultats des tests ==="
          if [ -f target/surefire-reports/com.exemple.CalculatorTest.txt ]; then
            cat target/surefire-reports/com.exemple.CalculatorTest.txt
          else
            echo "Aucun rapport trouvé"
          fi

      - name: Signaler un échec
        if: failure()
        run: echo "Les tests ont échoué. Vérifiez le code."
